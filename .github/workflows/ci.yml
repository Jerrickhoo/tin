# CI — verify pull requests before merge. Netlify runs the same mandatory
# checks plus a read-only schema prerequisite check before publishing.
#
# Main still triggers Netlify independently of GitHub status, so required
# checks live in Netlify's build command as well. Its check subprocess clears
# live probe credentials and uses placeholder test backend configuration;
# only the final build receives the actual public deployment configuration.
# Fifty pushes a month is ~5% of the allowance.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# a fast follow-up push shouldn't queue behind the run it already obsoleted
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24' # matches netlify.toml's NODE_VERSION
          cache: npm

      - run: npm ci

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      # cheapest first, so an obvious failure reports in seconds
      - name: Lint
        run: npm run lint

      - name: Formatting
        run: npm run format:check

      - name: AA contrast (ROADMAP 7.5)
        run: npm run check:contrast

      # --color-base makes Tailwind emit `.text-base{color:...}` and drop the
      # font-size rule entirely, so `text-base` silently paints text the
      # background colour. Six headers shipped invisible before this existed.
      - name: Token / utility collisions
        run: npm run check:tokens

      - name: Disposable PostgreSQL migration and financial invariants
        run: npm run check:sql

      # The three supabase/tests integration files are describe.skipIf'd on
      # PROBE_B_PASSWORD and import their modules inside the test body, so they
      # skip here without credentials instead of failing. Deliberate: this job
      # must never need a secret to be useful, and must never write to the
      # live project.
      - name: Tests
        run: npm test

      - name: Deployment and staging guards
        run: npm run check:guards

      # `tsc -b && vite build` — the same command Netlify runs, so a broken
      # build is caught here rather than discovered in the deploy log.
      - name: Build
        run: npm run build
        env:
          # Vite inlines these at build time; the real values live in Netlify.
          # Placeholders keep the build deterministic and make it obvious that
          # nothing here is deployable. src/db/supabase.ts only throws on a
          # missing value at RUNTIME, so the build never executes this.
          VITE_SUPABASE_URL: https://ci-placeholder.invalid
          VITE_SUPABASE_ANON_KEY: ci-placeholder-not-a-real-key
